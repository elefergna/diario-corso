<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2f6f62">
<title>Diario corso pre-A1</title>
<style>
:root{--bg:#faf8f4;--card:#fff;--tx:#2a2622;--mu:#7a7268;--ac:#2f6f62;--acs:#e3efeb;--bd:#e4ded3;--wa:#b4531f;--ok:#2f6f62}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1b19;--card:#262421;--tx:#ece7df;--mu:#a39b8f;--ac:#6fc2b0;--acs:#27403a;--bd:#3a3733;--wa:#e8895a;--ok:#6fc2b0}}
:root[data-theme="dark"]{--bg:#1c1b19;--card:#262421;--tx:#ece7df;--mu:#a39b8f;--ac:#6fc2b0;--acs:#27403a;--bd:#3a3733;--wa:#e8895a;--ok:#6fc2b0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding:0 max(16px,env(safe-area-inset-right)) 80px max(16px,env(safe-area-inset-left))}
#w{max-width:860px;margin:0 auto}
h1{font-size:1.35rem;margin:18px 0 2px}h2{font-size:1.1rem;margin:0 0 8px}h3{font-size:1rem;margin:0}
.sub{color:var(--mu);font-size:.88rem;margin:0 0 12px}
nav{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;position:sticky;top:0;background:var(--bg);z-index:5}
nav a{flex:none;padding:8px 13px;border-radius:999px;border:1px solid var(--bd);color:var(--mu);text-decoration:none;font-size:.92rem;background:var(--card)}
nav a.on{background:var(--ac);border-color:var(--ac);color:#fff}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:0 0 12px}
.bar{height:8px;border-radius:99px;background:var(--bd);overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--ac)}.bar b{position:absolute;top:0;bottom:0;width:2px;background:var(--wa)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.mu{color:var(--mu);font-size:.85rem}
button,.btn{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:9px;padding:8px 13px;cursor:pointer;text-decoration:none;display:inline-block}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}button.d{color:var(--wa)}button.s{padding:4px 9px;font-size:.82rem}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:9px;padding:9px 10px;width:100%}
textarea{min-height:130px;resize:vertical}
.print-item{padding:9px 0;border-top:1px solid var(--bd);overflow-wrap:anywhere}
.print-option{display:flex;align-items:center;gap:8px;color:var(--tx);width:fit-content}
.print-option input{width:auto;margin:0}
.color-picker{margin-top:8px}
button.color-dot{width:32px;height:32px;padding:0;display:inline-grid;place-items:center;border-radius:50%}
.color-dot::before{content:"";width:16px;height:16px;border-radius:50%;background:var(--swatch)}
.color-dot[aria-pressed="true"]{outline:2px solid var(--tx);outline-offset:1px}
.attachment-file{max-width:100%;text-align:left;overflow-wrap:anywhere}
label{display:block;font-size:.82rem;color:var(--mu);margin:10px 0 3px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cal{width:100%;border-collapse:separate;border-spacing:3px;table-layout:fixed}
.cal th{font-size:.75rem;color:var(--mu);font-weight:500;padding:4px 0}
.cal td{height:62px;border:1px solid var(--bd);border-radius:9px;vertical-align:top;padding:4px 5px;cursor:pointer;background:var(--card);overflow:hidden}
.cal td.out{opacity:.35}.cal td.l{background:var(--acs);border-color:var(--ac)}
.cal td.x{background:repeating-linear-gradient(45deg,var(--bg),var(--bg) 5px,var(--bd) 5px,var(--bd) 6px)}
.cal td.t{outline:2px solid var(--wa)}
.cal .n{font-size:.85rem;font-weight:600}.cal .h{font-size:.7rem;color:var(--ac);float:right}
.dots{display:flex;gap:3px;flex-wrap:wrap;margin-top:3px}.dots i{width:9px;height:9px;border-radius:50%;border:2px solid var(--ac);background:var(--ac)}.dots i.p{background:transparent}
.en{border-left:5px solid var(--bd);padding-left:10px}
.pill{display:inline-block;font-size:.74rem;padding:2px 8px;border-radius:99px;background:var(--acs);color:var(--ac)}.pill.p{background:#f6e3d6;color:var(--wa)}
@media (prefers-color-scheme:dark){.pill.p{background:#43302a}}
.warn{background:#f6e3d6;color:#7a3a14;border-radius:9px;padding:8px 11px;font-size:.88rem;margin:0 0 12px}
@media (prefers-color-scheme:dark){.warn{background:#43302a;color:#f0b89b}}
.cal td{font-size:.8rem}
@media (max-width:520px){.cal td{height:54px;padding:3px}.g2{grid-template-columns:1fr}.cal .h{display:none}}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:.9rem;opacity:0;transition:.2s;pointer-events:none}
#toast.on{opacity:1}
</style></head><body>
<div id="w">
<h1>Diario del corso pre-A1</h1>
<div class="row sp" style="margin-bottom:10px"><span class="sub" id="st" style="margin:0">Caricamento…</span><button class="s" data-a="rf">Aggiorna</button></div>
<div id="warn"></div>
<nav id="nav"></nav>
<div id="app"></div>
</div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const GI=['domenica','lunedì','martedì','mercoledì','giovedì','venerdì','sabato'];
const MESI=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
const KN=['Nessun colore','Rosso','Arancione','Giallo','Verde','Blu','Viola'];
const COLOR_OPTIONS=[3,4,1,5,6];
const KC=['','#d6453d','#e67e22','#f1c40f','#2e9664','#3484d6','#8e5fc4'];
const LV=['Va bene','Da seguire','Ha bisogno di aiuto'];
const T=(id,n,h)=>({id,n,h});
const OLD_END='2027-02-11',COURSE_END='2027-02-22';
const DEF={courseExtension:true,start:'2026-11-04',end:COURSE_END,weekly:{1:4,3:4,4:3},
 closures:[{a:'2026-12-07',b:'2026-12-07',l:'Niente lezione'},{a:'2026-12-24',b:'2027-01-06',l:'Scuola chiusa'}],
 modules:[
 {id:'m1',n:'Introduzione alla lingua italiana',h:50,t:[T('t1','Alfabeto e pronuncia',14),T('t2','Saluti e presentazioni',14),T('t3','Numeri e colori',11),T('t4','Giorni della settimana e mesi dell’anno',11)]},
 {id:'m2',n:'Grammatica essenziale, lessico e comunicazione di base',h:65,t:[T('t5','Articoli determinativi e indeterminativi',6),T('t6','Pronomi personali',4),T('t7','Verbi essere e avere',6),T('t8','Presente indicativo: verbi regolari e alcuni irregolari',8),T('t9','Espressioni di cortesia',3),T('t10','Fare acquisti e ordinare al ristorante',6),T('t11','Chiedere e dare indicazioni',5),T('t12','La famiglia e gli amici',5),T('t13','La casa e gli oggetti di uso comune',5),T('t14','Il cibo e le bevande',5),T('t15','Luoghi in città: negozi, ristoranti, mezzi di trasporto',6),T('t16','Formulare domande e risposte semplici',6)]},
 {id:'m3',n:'Attività interattive e apprendimento',h:35,t:[T('t17','Attività interattive su contenuti già svolti',35)]}]};
const COL={entries:'entries',students:'students',diff:'difficulties'};
let DB=null,S={config:null,entries:{},students:{},diff:{}},loaded=false,month=null,edit={},pending=false,armed=null;
function updateCourseConfig(c){
 if(!c||c.courseExtension)return c;
 return {...c,courseExtension:true,end:c.end===OLD_END?COURSE_END:c.end,
  modules:c.modules.map(m=>m.id==='m3'?{...m,h:m.h===20?35:m.h,
   t:m.t.map(t=>t.id==='t17'&&t.h===20?{...t,h:35}:t)}:m)};
}
const cfg=()=>S.config||DEF;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>ds(new Date());
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2200)}
function closure(d){return cfg().closures.find(c=>c.a<=d&&d<=c.b)}
function hoursOn(d){if(closure(d))return 0;return +cfg().weekly[pd(d).getDay()]||0}
function lessons(){const c=cfg(),r=[];for(let x=pd(c.start),e=pd(c.end);x<=e;x.setDate(x.getDate()+1)){const d=ds(x),h=hoursOn(d);if(h)r.push({d,h})}return r}
function topics(){return cfg().modules.flatMap(m=>m.t.map(t=>({...t,m:m.n})))}
const em=e=>e.mn!=null?+e.mn:Math.round((+e.h||0)*60);
const fm=m=>{m=Math.round(m);const h=Math.floor(m/60),r=m%60;return h&&r?h+' h '+r+' min':h?h+' h':r+' min'};
const fs=d=>{const x=pd(d);return GI[x.getDay()].slice(0,3)+' '+x.getDate()+' '+MESI[x.getMonth()].slice(0,3)};
const tname=id=>(topics().find(t=>t.id===id)||{n:''}).n;
function entriesOn(d){return Object.entries(S.entries).filter(([,e])=>e.date===d).map(([id,e])=>({id,...e}))}
function fmt(d){const x=pd(d);return GI[x.getDay()]+' '+x.getDate()+' '+MESI[x.getMonth()]+' '+x.getFullYear()}
/* ---- storage (GitHub) ---- */
const CK='dc3-cfg',DK='dc3-data';
let G={owner:'',repo:'',token:'',path:'diario.json',branch:''},sha=null,pendingFns=[],chain=Promise.resolve();
try{G=Object.assign(G,JSON.parse(localStorage.getItem(CK)||'{}'))}catch(e){}
const hasG=()=>G.owner&&G.repo&&G.token;
function cacheLocal(){try{localStorage.setItem(DK,JSON.stringify(S))}catch(e){}}
function setSync(m,bad){const e=$('#st');if(e){e.textContent=m;e.style.color=bad?'var(--wa)':''}}
const b64e=s=>{let r='';new TextEncoder().encode(s).forEach(x=>r+=String.fromCharCode(x));return btoa(r)};
const b64d=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0)));
const base=()=>`https://api.github.com/repos/${G.owner}/${G.repo}`;
const hdr=()=>({Authorization:'Bearer '+G.token,Accept:'application/vnd.github+json'});
const api=(m,body)=>fetch(`${base()}/contents/${G.path}`+(m==='GET'?`?t=${Date.now()}`+(G.branch?`&ref=${encodeURIComponent(G.branch)}`:''):''),{method:m,cache:'no-store',headers:hdr(),body:body?JSON.stringify(body):undefined});
async function pull(){
 const r=await api('GET');
 if(r.status===404){const q=await fetch(base(),{cache:'no-store',headers:hdr()});if(!q.ok)throw new Error('Repository non trovato o token senza accesso');sha=null;return}
 if(r.status===401)throw new Error('Token non valido o scaduto');
 if(!r.ok)throw new Error('Errore GitHub '+r.status);
 const j=await r.json();sha=j.sha;
 const d=JSON.parse(b64d(j.content));S={config:updateCourseConfig(d.config)||null,entries:d.entries||{},students:d.students||{},diff:d.diff||{}};
}
async function push(){
 const body={message:'Aggiornamento diario',content:b64e(JSON.stringify(S)),sha:sha||undefined};
 if(G.branch)body.branch=G.branch;
 const r=await api('PUT',body);
 if(r.status===409||r.status===422)return'conflict';
 if(r.status===401||r.status===403||r.status===404)throw new Error('Il token non ha il permesso di scrivere su questo repository');
 if(!r.ok)throw new Error('Errore GitHub '+r.status);
 sha=(await r.json()).content.sha;return'ok';
}
function enqueue(fn){
 pendingFns.push(fn);
 chain=chain.then(async()=>{
  setSync('Salvataggio…');
  for(let i=0;i<4;i++){
   try{const r=await push();if(r==='ok'){pendingFns=pendingFns.filter(f=>f!==fn);cacheLocal();setSync('Salvato su GitHub · '+new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}));return true}
    await pull();pendingFns.forEach(f=>f());cacheLocal();render()}
   catch(e){setSync('Non salvato: '+e.message+' (modifica tenuta su questo dispositivo)',true);toast('Salvataggio non riuscito');return false}
  }return false}).catch(()=>false);
 return chain}
function apply(fn,paint=render){fn();cacheLocal();paint();return hasG()?enqueue(fn):Promise.resolve(true)}
const put=(col,id,obj)=>apply(()=>{if(col==='config')S.config=obj;else S[col][id]=obj});
const del=(col,id)=>apply(()=>{delete S[col][id]});
async function refresh(){
 if(!hasG())return;
 if(pendingFns.length)return;
 try{setSync('Aggiornamento…');await pull();cacheLocal();
  if(sha===null){await enqueue(()=>{})}
  else setSync('Aggiornato · '+new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}));
  softRender()}
 catch(e){setSync('Impossibile aggiornare: '+e.message,true)}
}
function softRender(){
 const form=$('form[data-f="entry"]');
 if(form&&(form.elements.files.files.length||form.querySelector('button.p').disabled)){pending=false;return}
 const a=document.activeElement;if(a&&$('#app').contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)){pending=true;return}render()}
document.addEventListener('focusout',()=>setTimeout(()=>{if(pending){pending=false;softRender()}},150));
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
async function init(){
 try{const l=JSON.parse(localStorage.getItem(DK)||'null');if(l)S={...S,...l,config:updateCourseConfig(l.config)||null}}catch(e){}
 try{await loadAttachmentNames()}catch(e){}
 loaded=true;
 if(!hasG()){setSync('Non collegato a GitHub: i dati restano solo su questo dispositivo.',true);render();return}
 render();await refresh();
}
/* ---- local attachments ---- */
const attachmentNames=new Map();
let attachmentDB;
function openAttachmentDB(){
 if(!attachmentDB)attachmentDB=new Promise((resolve,reject)=>{
  const request=indexedDB.open('dc3-attachments',1);
  request.onupgradeneeded=()=>request.result.createObjectStore('files');
  request.onsuccess=()=>resolve(request.result);
  request.onerror=()=>reject(request.error);
 }).catch(error=>{attachmentDB=null;throw error});
 return attachmentDB;
}
async function attachmentTransaction(mode,operation){
 const db=await openAttachmentDB();
 return new Promise((resolve,reject)=>{
  const tx=db.transaction('files',mode);
  tx.onabort=()=>reject(tx.error);
  try{
   const request=operation(tx.objectStore('files'));
   tx.oncomplete=()=>resolve(request?.result);
  }catch(error){tx.abort();reject(error)}
 });
}
const filesFor=id=>attachmentNames.get(id)||[];
async function loadAttachmentNames(){
 const keys=await attachmentTransaction('readonly',store=>store.getAllKeys());
 attachmentNames.clear();
 for(const [id,name] of keys)attachmentNames.set(id,[...filesFor(id),name]);
}
async function saveAttachments(id,files,removed){
 await attachmentTransaction('readwrite',store=>{
  for(const name of removed)store.delete([id,name]);
  for(const file of files)store.put(file,[id,file.name]);
 });
 const names=new Set(filesFor(id).filter(name=>!removed.includes(name)));
 for(const file of files)names.add(file.name);
 if(names.size)attachmentNames.set(id,[...names]);else attachmentNames.delete(id);
}
async function openAttachment(id,name){
 const tab=/\.pdf$/i.test(name)?window.open('about:blank','_blank'):null;
 if(tab)tab.opener=null;
 try{
  const file=await attachmentTransaction('readonly',store=>store.get([id,name]));
  if(!file)throw new Error('File mancante');
  const url=URL.createObjectURL(tab?new Blob([file],{type:'application/pdf'}):file);
  if(tab&&!tab.closed)tab.location.replace(url);
  else{
   const link=document.createElement('a');
   link.href=url;link.download=name;document.body.append(link);link.click();link.remove();
  }
  setTimeout(()=>URL.revokeObjectURL(url),120000);
 }catch(e){tab?.close();toast('Impossibile aprire il file in questo browser')}
}
function attachmentButtons(id){
 return filesFor(id).map(name=>`<button type="button" class="s attachment-file"
  data-a="file" data-id="${esc(id)}" data-name="${esc(name)}">${/\.pdf$/i.test(name)?'Apri PDF':'Scarica'} · ${esc(name)}</button>`).join('');
}
/* ---- views ---- */
const TABS=[['piano','Panoramica'],['calendario','Calendario'],['nota','Nota veloce'],['diario','Diario'],['classe','Classe'],['difficolta','Difficoltà'],['dati','Dati'],['sync','Sincronia']];
function route(){const h=location.hash.slice(1)||'piano';if(h.startsWith('giorno-'))return{v:'giorno',d:h.slice(7)};return{v:h}}
function bar(done,plan,tot,mark){const p=x=>Math.min(100,tot?x/tot*100:0);return`<div class="bar"><i style="width:${p(done)}%"></i>${mark!=null?`<b style="left:${p(mark)}%"></b>`:''}</div>`}
function sums(){const f={},p={};for(const e of Object.values(S.entries)){const m=e.s==='f'?f:p;m[e.u||'']=(m[e.u||'']||0)+em(e)}return{f,p}}
function materialText(value){
 const material=String(value||'').trim();
 if(/^https?:\/\/[^\s]+$/i.test(material)){
  return `<a href="${esc(material)}" target="_blank" rel="noopener noreferrer">${esc(material)}</a>`;
 }
 return esc(material);
}
function printQueue(){
 const items=Object.entries(S.entries).filter(([id,e])=>e.print&&(String(e.m||'').trim()||filesFor(id).length))
  .sort(([,a],[,b])=>a.date.localeCompare(b.date));
 return `<section class="c"><h2>Da stampare</h2>
 ${items.length?items.map(([id,e])=>`<div class="row sp print-item">
 <div><a class="mu" href="#giorno-${esc(e.date)}">${fmt(e.date)}</a>
 ${e.m?`<div>${materialText(e.m)}</div>`:''}
 <div class="row">${attachmentButtons(id)}</div></div>
 <button class="s" data-a="printed" data-id="${esc(id)}">Segna come stampato</button></div>`).join('')
 :'<p class="mu" style="margin:0">Nessun materiale da stampare.</p>'}</section>`;
}
function vPiano(){
 const L=lessons(),tot=L.reduce((a,l)=>a+l.h*60,0),t0=today(),el=L.filter(l=>l.d<=t0).reduce((a,l)=>a+l.h*60,0),{f,p}=sums();
 const done=Object.values(f).reduce((a,b)=>a+b,0),target=cfg().modules.reduce((a,m)=>a+m.h*60,0);
 let h=printQueue()+`<div class="c"><div class="row sp"><h2>Corso: ${fm(target)}</h2><span class="mu">${L.length} lezioni · ${fm(tot)} in calendario</span></div>
 <p class="mu" style="margin:0 0 8px">Fatte (registrate) ${fm(done)} · lezione trascorsa a oggi ${fm(el)} · la linea arancione è dove dovresti essere.</p>${bar(done,0,tot,el)}
 ${tot!==target?`<p class="mu" style="color:var(--wa)">Attenzione: il calendario dà ${fm(tot)}, il corso ne prevede ${fm(target)}. Controlla Dati.</p>`:''}</div>`;
 for(const m of cfg().modules){
  const md=m.t.reduce((a,t)=>a+(f[t.id]||0),0),sum=m.t.reduce((a,t)=>a+t.h,0)*60,mt=m.h*60;
  h+=`<div class="c"><div class="row sp"><h3>${esc(m.n)}</h3><span class="mu">${fm(md)} / ${fm(mt)}</span></div><div style="margin:8px 0">${bar(md,0,mt)}</div>
  ${sum!==mt?`<p class="mu" style="color:var(--wa);margin:0 0 6px">Gli argomenti sommano ${fm(sum)} su ${fm(mt)}.</p>`:''}`;
  for(const t of m.t){const a=f[t.id]||0,b=p[t.id]||0;
   h+=`<div style="padding:9px 0;border-top:1px solid var(--bd)"><div class="row sp"><span>${esc(t.n)}</span>
   <span class="row" style="gap:5px"><span class="mu">${fm(a)}${b?` (+${fm(b)} previste)`:''} /</span><input type="number" step="0.25" min="0" value="${t.h}" data-th="${t.id}" style="width:70px;padding:4px 6px"><span class="mu">h</span></span></div>${bar(a,0,t.h*60)}</div>`}
  h+='</div>'}
 const un=(f['']||0)+(p['']||0);if(un)h+=`<p class="mu">${fm(un)} di voci senza argomento assegnato.</p>`;
 return h}
function vCal(){
 if(!month){const d=pd(today()),s=pd(cfg().start);month=ds(d>=s&&d<=pd(cfg().end)?d:s).slice(0,7)}
 const[y,mo]=month.split('-').map(Number),first=new Date(y,mo-1,1),off=(first.getDay()+6)%7,t0=today();
 let h=`<div class="c"><div class="row sp" style="margin-bottom:8px"><button data-a="mm" data-v="-1">‹</button><h2 style="margin:0">${MESI[mo-1]} ${y}</h2><button data-a="mm" data-v="1">›</button></div>
 <table class="cal"><tr>${['Lun','Mar','Mer','Gio','Ven','Sab','Dom'].map(x=>`<th>${x}</th>`).join('')}</tr>`;
 const x=new Date(y,mo-1,1-off);
 for(let r=0;r<6;r++){h+='<tr>';for(let c=0;c<7;c++){const d=ds(x),inm=x.getMonth()===mo-1,hr=hoursOn(d),cl=closure(d),es=entriesOn(d),inr=d>=cfg().start&&d<=cfg().end;
  h+=`<td data-a="go" data-d="${d}" class="${inm?'':'out'} ${hr&&inr?'l':''} ${cl&&inr?'x':''} ${d===t0?'t':''}" title="${cl?esc(cl.l):''}"><span class="n">${x.getDate()}</span>${hr&&inr?`<span class="h">${hr}h</span>`:''}
